# Separate replacement stack, never start beside the legacy compose.yml stack.
# Run from repository root with `docker compose -f deployment/compose.self-hosted.yml ...`.
# Native TLS is mandatory for the container's non-loopback listener.
services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.self-hosted
      args:
        NODE_IMAGE: ${DOTS_NODE_IMAGE:-node:24-bookworm-slim}
    user: '1000:1000'
    init: true
    read_only: true
    ports:
      - '127.0.0.1:4310:4310'
    environment:
      HOST: 0.0.0.0
      PORT: '4310'
      DATABASE_PATH: /state/dots.sqlite
      OWNER_ID: ${OWNER_ID:-opendots-owner}
      OWNER_TOKEN_FILE: /run/secrets/owner_token
      APP_ORIGIN: ${APP_ORIGIN:?Set the exact HTTPS owner origin}
      TLS_CERT_PATH: /run/operator-tls/cert.pem
      TLS_KEY_PATH: /run/operator-tls/key.pem
      # No Intelligence, managed Channels, model keys or legacy runner settings.
    secrets:
      - owner_token
    volumes:
      - type: bind
        source: ${DOTS_STATE_ROOT:?Existing private UID-1000 state directory required}
        target: /state
      - type: bind
        source: ${DOTS_GATE_ROOT:?Existing private UID-1000 gate directory required}
        target: /gate
      - type: bind
        source: ${DOTS_TLS_DIRECTORY:?Existing reviewed TLS certificate directory required}
        target: /run/operator-tls
        read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 40s
    restart: unless-stopped
    healthcheck:
      # Liveness alone: no owner secret in arguments/logs, no TLS bypass flag.
      # The application image needs the staged /health/live integration.
      test:
        [
          'CMD',
          '/usr/local/bin/node',
          '-e',
          'const fs=require("node:fs"),https=require("node:https");const u=new URL(process.env.APP_ORIGIN);https.get({hostname:"127.0.0.1",port:4310,path:"/health/live",servername:u.hostname,ca:fs.readFileSync(process.env.TLS_CERT_PATH),headers:{Host:u.host}},r=>process.exit(r.statusCode===200?0:1)).on("error",()=>process.exit(1));',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
secrets:
  owner_token:
    file: ${DOTS_OWNER_TOKEN_FILE:?Path to an existing operator-provided owner secret}
